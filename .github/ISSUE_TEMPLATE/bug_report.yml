name: Bug report
description: Report a reproducible SDK or AR runtime issue
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal steps or a repository when possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Device, Android version, browser/WebView, Capacitor version, and SDK version.
    validations:
      required: true
